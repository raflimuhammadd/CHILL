global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rule files untuk alerting (bisa skip untuk sekarang)
rule_files:
  # - "alert_rules.yml"

# Alerting configuration (skip untuk sekarang)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # Prometheus sendiri
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API kita
  - job_name: 'chill-streams-api'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Node Exporter (EC2 host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s