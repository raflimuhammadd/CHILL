services:
  # Main Backend Application
  backend:
    image: ${DOCKER_USERNAME:-raflimuhh}/chill-streams-backend:${TAG:-latest}
    container_name: chill-streams-backend-prod
    ports:
      - "3000:3000"
    env_file:
      - .env.docker.production
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - chill-streams-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.7'
          memory: 350M
        reservations:
          cpus: '0.35'
          memory: 175M

  # MySQL Database (Now on EC2)
  mysql:
    image: mysql:8.4-alpine
    container_name: chill-streams-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme123}
      MYSQL_DATABASE: chill_streams_prod
      MYSQL_USER: ${MYSQL_USER:-chill_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-securepassword123}
      MYSQL_INNODB_BUFFER_POOL_SIZE: 64M
      MYSQL_MAX_CONNECTIONS: 50
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - chill-streams-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 300M
        reservations:
          cpus: '0.15'
          memory: 150M

  # MySQL Exporter for Monitoring (Optional - can be added later)
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter
    environment:
      DATA_SOURCE_NAME: "${MYSQL_USER:-chill_user}:${MYSQL_PASSWORD:-securepassword123}@tcp(mysql:3306)/"
    ports:
      - "9104:9104"
    networks:
      - chill-streams-prod-network
    depends_on:
      - mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 50M
        reservations:
          cpus: '0.05'
          memory: 25M

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=3d'  # Reduced from 7d for t3.micro
      - '--storage.tsdb.retention.size=1GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - chill-streams-prod-network
    depends_on:
      - backend
      - node-exporter
      - mysql-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 250M
        reservations:
          cpus: '0.125'
          memory: 125M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"  # Map to 3001 to avoid conflict with backend
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/chill-streams-overview.json
    networks:
      - chill-streams-prod-network
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 125M
        reservations:
          cpus: '0.075'
          memory: 62M

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - chill-streams-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 20M
        reservations:
          cpus: '0.025'
          memory: 10M

volumes:
  uploads:
    driver: local
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  chill-streams-prod-network:
    driver: bridge