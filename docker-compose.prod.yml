version: '3.8'

services:
  backend:
    image: ${DOCKER_USERNAME:-raflimuhh}/chill-streams-backend:${TAG:-latest}
    container_name: chill-streams-backend-prod
    ports:
      - "3000:3000"
    env_file:
      - .env.docker.production
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta  # Adjust to your timezone
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - chill-streams-prod-network

networks:
  chill-streams-prod-network:
    driver: bridge